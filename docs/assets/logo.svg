    <path d="M58.2 55.8V76.2C58.2 78.2 60.5 79.4 62.1 78.2L76.3 68C77.7 67 77.7 65 76.3 64L62.1 53.8C60.5 52.6 58.2 53.8 58.2 55.8Z" fill="#FFFFFF"/>
