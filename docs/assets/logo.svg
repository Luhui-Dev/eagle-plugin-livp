  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#bg)"/>
  <path d="M32 27C19.8 37.3 16.2 55.9 23.6 70.2" fill="none" stroke="url(#motion)" stroke-width="7" stroke-linecap="round"/>
  <path d="M95.8 29.2C108.6 39.2 112.8 58 105.5 73" fill="none" stroke="url(#motion)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M102.8 91.8C93.2 105 73.8 110.5 58.5 104.6" fill="none" stroke="url(#motion)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <g filter="url(#shadow)">
