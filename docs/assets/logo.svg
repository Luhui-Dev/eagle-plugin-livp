<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LIVP Preview Logo</title>
  <desc id="desc">A compact Live Photo preview icon with a photo card, play symbol, and motion rings.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="12" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="photo" x1="35" y1="33" x2="91" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#DDE7F5"/>
    </linearGradient>
    <linearGradient id="imageFill" x1="38" y1="48" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28D9C8"/>
      <stop offset="0.52" stop-color="#2E7CF6"/>
      <stop offset="1" stop-color="#7756F5"/>
    </linearGradient>
    <linearGradient id="motion" x1="17" y1="26" x2="107" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43F5D6"/>
